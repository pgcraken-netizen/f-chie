<title>福田ちえ ホームページ デザイン案</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#C8176F;--ink:#333;--line:#EEE6E2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#FBF8F4;letter-spacing:.08em;line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
main{width:100%;max-width:640px}

p.lead{font-size:14px;color:#666;margin-bottom:28px}
ul{list-style:none;display:grid;gap:14px}
a{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:12px;padding:20px 22px;text-decoration:none;color:inherit;transition:.2s}
a:hover{box-shadow:0 10px 24px rgba(200,23,111,.1)}
b{font-size:18px}
small{display:block;font-size:13px;color:#666;margin-top:2px}
span.go{color:var(--pink);font-weight:700;white-space:nowrap}
</style>
</head>
